<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>EngSite Capture (Language Reactor)</title>
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      margin: 0;
    }
    h2 {
      font-size: 14px;
      margin: 0 0 12px;
      color: #a78bfa;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 10px;
      background: #a78bfa33;
      border: 1px solid #a78bfa55;
      color: #a78bfa;
      padding: 1px 6px;
      border-radius: 20px;
    }
    .desc {
      font-size: 12px;
      line-height: 1.6;
      color: #9ca3af;
      margin-bottom: 14px;
    }
    .desc code {
      background: #ffffff15;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 11px;
    }
    button.copy-action {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button.copy-action:hover { opacity: 0.85; }
    #result {
      margin-top: 10px;
      font-size: 12px;
      color: #6ee7b7;
      min-height: 18px;
      text-align: center;
    }
    .tip {
      margin-top: 14px;
      font-size: 11px;
      color: #6b7280;
      border-top: 1px solid #ffffff10;
      padding-top: 10px;
    }
  </style>
</head>
<body>
  <h2>📋 EngSite Capture (Language Reactor) <span class="badge">v1.0</span></h2>
  <p class="desc">
    翻訳テキストにホバーすると表示される <code>コピーボタン</code> をクリックしてコピーできます。<br>
    または下のボタンで現在表示中の翻訳をコピーします。
  </p>
  <div style="display: flex; gap: 8px;">
    <button id="copyBtnOrigTrans" class="copy-action">原文→翻訳</button>
    <button id="copyBtnTransOrig" class="copy-action">翻訳→原文</button>
  </div>
  <div id="result"></div>
  <div class="tip">💡 翻訳テキストにカーソルを合わせると右端にコピーアイコンが表示されます</div>

  <script src="popup.js"></script>
</body>
</html>
